name: warehouse_mobile
description: "Warehouse Picker/Packer Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  mobile_scanner: ^5.0.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  audioplayers: ^6.0.0
  url_launcher: ^6.2.1 # For scan beep sounds
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^19.5.0
  vibration: ^3.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
